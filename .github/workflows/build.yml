name: Build ESP32-C3 Firmware

on:
  push:
    paths:
      - 'esp32FirstCode/esp32FirstCode.ino'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Arduino CLI & ESP32 Core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo arduino/arduino-cli --pattern "*Linux_64bit.tar.gz"
          tar xf arduino-cli_*_Linux_64bit.tar.gz
          sudo mv arduino-cli /usr/local/bin/
          ESP_URL="https:""//espressif.github.io/arduino-esp32/package_esp32_index.json"
          arduino-cli core update-index --additional-urls "$ESP_URL"
          arduino-cli core install esp32:esp32 --additional-urls "$ESP_URL"

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc --output-dir ./build esp32FirstCode

      - name: Force Replace Release File
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "latest" --notes "Auto build" || true
          gh release upload latest build/esp32FirstCode.ino.bin --clobber
